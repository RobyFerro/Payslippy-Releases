<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glowTL" cx="20%" cy="15%" r="55%">
      <stop offset="0%" stop-color="rgba(45,157,124,0.42)"/>
      <stop offset="60%" stop-color="rgba(45,157,124,0.08)"/>
      <stop offset="100%" stop-color="rgba(45,157,124,0)"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="85%" cy="90%" r="40%">
      <stop offset="0%" stop-color="rgba(79,190,156,0.22)"/>
      <stop offset="100%" stop-color="rgba(79,190,156,0)"/>
    </radialGradient>
    <linearGradient id="ogPaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F4ED"/>
      <stop offset="100%" stop-color="#EDE7D6"/>
    </linearGradient>
    <marker id="ogArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4FBE9C"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#060F0D"/>
  <rect width="1200" height="630" fill="url(#glowTL)"/>
  <rect width="1200" height="630" fill="url(#glowBR)"/>

  <!-- Subtle dot pattern -->
  <g fill="#1F4A3F" opacity="0.35">
    <g>
      <circle cx="0" cy="0" r="1.2"/>
    </g>
  </g>

  <!-- Brand row -->
  <g transform="translate(80 80)">
    <!-- Stylized logo mark -->
    <g>
      <rect width="44" height="44" rx="10" fill="#2D9D7C"/>
      <path d="M14 32 L14 14 L22 14 L30 22 L30 32 z" fill="#0A1614"/>
      <circle cx="22" cy="22" r="3" fill="#5FE3B5"/>
    </g>
    <text x="60" y="32" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#E6F0EC" letter-spacing="-0.5">DocuMiner</text>
  </g>

  <!-- Eyebrow chip -->
  <g transform="translate(80 168)">
    <rect width="320" height="34" rx="17" fill="rgba(45,157,124,0.14)" stroke="rgba(45,157,124,0.4)"/>
    <circle cx="18" cy="17" r="4" fill="#5FE3B5"/>
    <text x="32" y="22" font-family="IBM Plex Mono, monospace" font-size="12" fill="#4FBE9C" letter-spacing="0.5">App desktop · Windows 10/11</text>
  </g>

  <!-- Headline -->
  <text x="80" y="290" font-family="Inter, sans-serif" font-size="64" font-weight="700" fill="#E6F0EC" letter-spacing="-2">I tuoi PDF nascondono</text>
  <text x="80" y="362" font-family="Inter, sans-serif" font-size="64" font-weight="700" fill="#E6F0EC" letter-spacing="-2">un database.</text>
  <text x="80" y="434" font-family="Inter, sans-serif" font-size="64" font-weight="700" fill="#4FBE9C" letter-spacing="-2">Sul tuo PC.</text>

  <!-- Subline -->
  <text x="80" y="496" font-family="Inter, sans-serif" font-size="22" fill="#93A8A1">App desktop per Windows. Niente cloud, niente upload.</text>

  <!-- Footer URL -->
  <text x="80" y="572" font-family="IBM Plex Mono, monospace" font-size="14" fill="#6B847C">robyferro.github.io/Payslippy-Releases</text>

  <!-- Mini PDF→DB mockup (right side) -->
  <g transform="translate(780 200)">
    <!-- PDF -->
    <g transform="translate(0 0)">
      <rect width="150" height="200" rx="6" fill="url(#ogPaper)" stroke="#C9C0A6"/>
      <text x="75" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1F2A28">Fattura</text>
      <g stroke="#C9C0A6">
        <line x1="14" y1="46" x2="136" y2="46"/>
        <line x1="14" y1="60" x2="120" y2="60"/>
      </g>
      <!-- highlighted fields -->
      <rect x="14" y="80" width="100" height="16" rx="3" fill="rgba(45,157,124,0.25)" stroke="#2D9D7C" stroke-width="1.2"/>
      <rect x="14" y="106" width="70" height="16" rx="3" fill="rgba(79,190,235,0.25)" stroke="#4FB3E8" stroke-width="1.2"/>
      <rect x="14" y="132" width="86" height="16" rx="3" fill="rgba(232,165,79,0.25)" stroke="#E8A54F" stroke-width="1.2"/>
      <rect x="14" y="158" width="60" height="16" rx="3" fill="rgba(207,113,194,0.25)" stroke="#CF71C2" stroke-width="1.2"/>
    </g>

    <!-- flow arrows -->
    <g fill="none" stroke="#4FBE9C" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ogArrow)">
      <path d="M 154 90 C 180 90, 180 60, 210 60"/>
      <path d="M 154 116 C 180 116, 180 104, 210 104"/>
      <path d="M 154 142 C 180 142, 180 148, 210 148"/>
      <path d="M 154 168 C 180 168, 180 192, 210 192"/>
    </g>

    <!-- DB table -->
    <g transform="translate(210 24)">
      <rect width="220" height="180" rx="8" fill="#14332B" stroke="#1F4A3F"/>
      <rect width="220" height="26" rx="8" fill="#163930"/>
      <rect y="18" width="220" height="10" fill="#163930"/>
      <g font-family="IBM Plex Mono, monospace" font-size="8" font-weight="600" fill="#93A8A1" letter-spacing="0.4">
        <text x="10" y="17">CLIENTE</text>
        <text x="92" y="17">DATA</text>
        <text x="140" y="17">IMP.</text>
        <text x="186" y="17">IVA</text>
      </g>
      <!-- current row -->
      <rect x="0" y="34" width="220" height="26" fill="rgba(45,157,124,0.16)"/>
      <rect x="0" y="34" width="3" height="26" fill="#4FBE9C"/>
      <g font-family="IBM Plex Mono, monospace" font-size="10" fill="#E6F0EC">
        <text x="10" y="51">Bianchi G.</text>
        <text x="92" y="51">02.01</text>
        <text x="140" y="51">1.000</text>
        <text x="186" y="51">220</text>
      </g>
      <g font-family="IBM Plex Mono, monospace" font-size="10" fill="#93A8A1">
        <g transform="translate(0 60)">
          <text x="10" y="14">Verdi M.</text>
          <text x="92" y="14">28.12</text>
          <text x="140" y="14">2.450</text>
          <text x="186" y="14">539</text>
        </g>
        <g transform="translate(0 80)">
          <text x="10" y="14">Rossi A.</text>
          <text x="92" y="14">22.12</text>
          <text x="140" y="14">880</text>
          <text x="186" y="14">194</text>
        </g>
        <g transform="translate(0 100)" opacity="0.6">
          <text x="10" y="14">Neri L.</text>
          <text x="92" y="14">15.12</text>
          <text x="140" y="14">3.120</text>
          <text x="186" y="14">686</text>
        </g>
        <g transform="translate(0 120)" opacity="0.3">
          <text x="10" y="14">Gialli P.</text>
          <text x="92" y="14">10.12</text>
          <text x="140" y="14">540</text>
          <text x="186" y="14">119</text>
        </g>
      </g>
      <rect y="160" width="220" height="20" fill="#0E2622"/>
      <text x="10" y="174" font-family="IBM Plex Mono, monospace" font-size="9" fill="#6B847C">+ 42 altre righe</text>
      <text x="210" y="174" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="9" fill="#4FBE9C">47 totali</text>
    </g>
  </g>
</svg>
